<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>متجر الأناقة</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-bottom: 0;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 25px;
        }

        .product {
            background: white;
            width: 280px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 12px #ccc;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .whatsapp {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 10px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ متجر الأناقة</h1>
        <p>ملابس عصرية بأسعار مناسبة</p>
    </header>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
            <h2>تيشيرت أبيض</h2>
            <p class="price">350 جنيه</p>
            <a class="واتساب" href="https://wa.me/201105569377" target="_blank">تواصل واتساب</a>

        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3">
            <h2>جاكت أسود</h2>
            <p class="price">650 جنيه</p>
            <a class="واتساب" href="https://wa.me/201105569377" target="_blank">تواصل واتساب</a>

        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5">
            <h2>هودي شتوي</h2>
            <p class="price">550 جنيه</p>
      <a class="واتساب" href="https://wa.me/201105569377" target="_blank">تواصل واتساب</a>

        </div>

    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 متجر الأناقة
    </footer>

</body>
</html>
